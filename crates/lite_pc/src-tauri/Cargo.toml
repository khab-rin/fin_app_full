[package]
name = "xpin_pc"
version = "0.1.0"
description = "fin_helper"
authors = ["xpinat Support oreolkazan@gmail.com"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.85"


[lib]
name = "xpin_pc"
crate-type = ["rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
shared_lib = { workspace = true, features= ['lite_pc'] }

chrono = { workspace = true }

log = { workspace = true }

tauri = { workspace = true, features = [] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-fs = { workspace = true}
tauri-plugin-machine-uid = { workspace = true}

tokio = { workspace = true }
