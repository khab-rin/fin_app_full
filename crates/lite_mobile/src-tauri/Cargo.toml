[package]
name = "xpin_mobile"
version = "0.1.0"
description = "fin_helper"
authors = ["xpinat Support oreolkazan@gmail.com"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"


[lib]
name = "xpin_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
shared_lib = { workspace = true, features= ['lite_mobile'] }

chrono = { workspace = true }

keyring = { workspace = true, features = [ "v1", "android-native-keyring-store", ] }
keyring-core = { workspace = true }

log = { workspace = true }

tauri = { workspace = true, features = [] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-fs = { workspace = true}
tauri-plugin-machine-uid = { workspace = true}

tokio = { workspace = true }

android-native-keyring-store = { workspace = true }

ndk-context = { workspace = true }

