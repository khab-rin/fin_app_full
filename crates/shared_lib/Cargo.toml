[package]
name="shared_lib"
version="0.1.0"
edition="2024"

[features]
default = []
server = [
    "dep:axum",
    "dep:tracing",
]

lite_pc = [
    "dep:dotenvy",
    "dep:keyring",
	"dep:keyring-core",
    "dep:tauri",
    "dep:tauri-plugin-fs",
	"dep:tauri-plugin-machine-uid"
]

lite_mobile = [
	"dep:android-native-keyring-store",
    "dep:dotenvy",
    "dep:keyring",
	"dep:keyring-core",
	"dep:ndk-context",
    "dep:tauri",
    "dep:tauri-plugin-fs",
	"dep:tauri-plugin-machine-uid",
]

[dependencies]
android-native-keyring-store = { workspace = true, optional = true}

anyhow = { workspace = true }

axum = { workspace = true, default-features = false, optional = true }

blake3 = { workspace = true }

chrono = { workspace = true }

dotenvy = { workspace = true, optional = true }

encoding_rs = { workspace = true }

futures = { workspace = true }

keyring = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true}

log = { workspace = true}

lopdf = { workspace = true}

ndk-context = { workspace = true, optional = true}

quick-xml = { workspace = true }

regex = { workspace = true }

reqwest = { workspace = true, features = ["json", "rustls", "query"] }
reqwest-middleware = { workspace = true, features = ["json", "query"]  }
reqwest-retry = { workspace = true }

rust_decimal = { workspace = true, features = ["db-postgres"] }

serde = { workspace = true }

serde_json = { workspace = true }

sqlx = { workspace = true, default-features = false, features = ["macros", "chrono", "rust_decimal", "json", "uuid", "sqlite", "postgres"] }

strum = { workspace = true }
strum_macros = { workspace = true }

tauri = { workspace = true, features = [], optional = true }
tauri-plugin-fs = { workspace = true, optional = true}
tauri-plugin-machine-uid = { workspace = true, optional = true}

tokio = { workspace = true, features = ["sync"] }

toml = { workspace = true }

tracing = { workspace = true, optional = true }

ts-rs = { workspace = true }

uuid = { workspace = true, features = ["v5"] }

vec1 =  {workspace = true, features = ["serde"] }




